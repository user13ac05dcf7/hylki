name: CI

# Runs the test suite and builds this fork's x86_64 Flatpak from the
# checkout, with the release manifest's recipe (tools/local-manifest.sh).
# Every push gets a bundle to try as an artifact; pushes to PUBLISH_REF are
# also signed and, once the tests pass, published as a Flatpak repository
# on GitHub Pages.

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLISH_REF: refs/heads/flatpak-ci
  # The fork's own app ID (tools/fork-app-id.sh), so it installs beside
  # Hylki's own Flatpak rather than in its place.
  APP_ID: io.github.user13ac05dcf7.Hylki
  COLLECTION_ID: io.github.user13ac05dcf7.Hylki

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    # Fedora carries the libadwaita the crate's v1_7 feature needs; Ubuntu
    # 24.04 does not.
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 90
    steps:
      - name: Install the toolchain and libraries
        run: |
          dnf install -y -q cargo rust gcc gcc-c++ git gtk4-devel libadwaita-devel \
            webkitgtk6.0-devel poppler-glib-devel openssl-devel dbus-devel \
            gettext-devel wayland-devel

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-

      - name: Run the tests
        run: cargo test --locked

  build:
    name: Build x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Give the build the fork's app ID
        run: tools/fork-app-id.sh "$APP_ID"

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree python3-aiohttp python3-tomlkit

      - name: Install the GNOME runtime and Rust SDK extension
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          version=$(sed -n "s/^runtime-version: '\(.*\)'/\1/p" "$APP_ID.yml")
          for attempt in 1 2 3; do
            flatpak install --user -y --noninteractive --no-static-deltas flathub \
              "org.gnome.Platform//$version" "org.gnome.Sdk//$version" \
              org.freedesktop.Sdk.Extension.rust-stable//25.08 && break
            echo "install attempt $attempt failed; retrying"
            sleep 30
          done

      - name: Vendor the crate sources
        run: |
          # Pinned: this job goes on to sign what it builds.
          curl -fsSL -o /tmp/gen-cargo-sources.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/74697c75b630d7330e77250fc13cb5ea688d9479/cargo/flatpak-cargo-generator.py
          for attempt in 1 2 3; do
            if python3 /tmp/gen-cargo-sources.py Cargo.lock -o cargo-sources.json 2>/tmp/gen.err; then
              break
            fi
            cat /tmp/gen.err
            module="$(sed -n "s/.*No module named '\([^']*\)'.*/\1/p" /tmp/gen.err | head -1)"
            [ -n "$module" ] || exit 1
            pip install --break-system-packages "$module"
          done
          test -s cargo-sources.json

      # Poppler and the dictionaries change rarely: keep flatpak-builder's
      # cache of those modules between runs.
      - uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles(format('{0}.yml', env.APP_ID)) }}-${{ github.sha }}
          restore-keys: flatpak-builder-${{ hashFiles(format('{0}.yml', env.APP_ID)) }}-

      # Without the secret the build still makes the bundle; only the signed
      # repository is left out.
      - name: Import the signing key
        id: key
        if: github.ref == env.PUBLISH_REF
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$FLATPAK_GPG_PRIVATE_KEY" ]; then
            echo "::warning::FLATPAK_GPG_PRIVATE_KEY is not set: building the bundle only, nothing is published"
            exit 0
          fi
          echo "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          FINGERPRINT: ${{ steps.key.outputs.fingerprint }}
        run: |
          ostree init --repo=repo --mode=archive-z2 --collection-id="$COLLECTION_ID"
          tools/local-manifest.sh /tmp/hylki.yml
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=repo --default-branch=stable \
            ${FINGERPRINT:+--gpg-sign=$FINGERPRINT} \
            build-dir /tmp/hylki.yml
          flatpak build-bundle repo Hylki-x86_64.flatpak "$APP_ID" stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/upload-artifact@v4
        with:
          name: Hylki-x86_64
          path: Hylki-x86_64.flatpak
          retention-days: 14
          if-no-files-found: error

      - name: Prepare the repository site
        if: steps.key.outputs.fingerprint != ''
        env:
          FINGERPRINT: ${{ steps.key.outputs.fingerprint }}
        run: |
          flatpak build-update-repo --gpg-sign="$FINGERPRINT" --generate-static-deltas \
            --prune --title="Hylki" --default-branch=stable repo
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          key=$(gpg --batch --export "$FINGERPRINT" | base64 -w0)
          mkdir -p site
          mv repo site/repo
          cat > site/hylki.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Hylki
          Url=$url/repo/
          Homepage=https://github.com/$GITHUB_REPOSITORY
          Comment=Hylki builds from $GITHUB_REPOSITORY
          DefaultBranch=stable
          DeployCollectionID=$COLLECTION_ID
          GPGKey=$key
          EOF
          cat > "site/$APP_ID.flatpakref" <<EOF
          [Flatpak Ref]
          Title=Hylki
          Name=$APP_ID
          Branch=stable
          Url=$url/repo/
          IsRuntime=false
          SuggestRemoteName=hylki
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          DeployCollectionID=$COLLECTION_ID
          GPGKey=$key
          EOF
          sed -i 's/^ *//' site/hylki.flatpakrepo "site/$APP_ID.flatpakref"
          printf '<!doctype html><title>Hylki Flatpak</title><p><a href="%s.flatpakref">Install Hylki</a> · <a href="hylki.flatpakrepo">Add the repository</a></p>\n' \
            "$APP_ID" > site/index.html

      - uses: actions/upload-pages-artifact@v3
        if: steps.key.outputs.fingerprint != ''
        with:
          path: site

    outputs:
      signed: ${{ steps.key.outputs.fingerprint != '' }}

  publish:
    name: Publish to GitHub Pages
    needs: [test, build]
    if: needs.build.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
